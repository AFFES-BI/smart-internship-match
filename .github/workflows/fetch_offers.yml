name: Fetch internship offers

# Lancement MANUEL uniquement : l'API Adzuna gratuite est limitee a 25 appels au total,
# et le prof deconseille toute planification automatique.
"on":
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_offers.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Commit updated offers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offers/raw_offers.json
          git commit -m "Fetch latest offers [automated]" || echo "Nothing to commit"
          git push
